<!DOCTYPE html>
<html>
<head>
    <title>College Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }

        form {
            width: 350px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }

        button[type="submit"] {
            background-color: green;
        }

        button[type="reset"] {
            background-color: red;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>

</head>
<body>

    <h2>College Registration Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Password:</label>
        <input type="password" placeholder="Enter password">

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Courses Interested:</label><br>
        <input type="checkbox"> CSE
        <input type="checkbox"> ECE
        <input type="checkbox"> MECH
        <input type="checkbox"> CIVIL
        <br><br>

        <label>Select Year:</label>
        <select>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Address:</label>
        <textarea rows="4" placeholder="Enter your address"></textarea>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
