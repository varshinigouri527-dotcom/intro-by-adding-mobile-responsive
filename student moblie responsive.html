<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container{
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .table-container{
            overflow-x: auto;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f9f9f9;
        }

        tr:hover{
            background-color: #e6f2ff;
        }

        @media (max-width: 600px){

            h1{
                font-size: 24px;
            }

            th, td{
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Marks Table</h1>

        <div class="table-container">
            <table>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Maths</th>
                    <th>Science</th>
                    <th>English</th>
                    <th>Total</th>
                    <th>Grade</th>
                </tr>

                <tr>
                    <td>101</td>
                    <td>Alice</td>
                    <td>90</td>
                    <td>85</td>
                    <td>88</td>
                    <td>263</td>
                    <td>A</td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Bob</td>
                    <td>78</td>
                    <td>82</td>
                    <td>80</td>
                    <td>240</td>
                    <td>B</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Charlie</td>
                    <td>95</td>
                    <td>92</td>
                    <td>96</td>
                    <td>283</td>
                    <td>A+</td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>David</td>
                    <td>70</td>
                    <td>75</td>
                    <td>72</td>
                    <td>217</td>
                    <td>C</td>
                </tr>

                <tr>
                    <td>105</td>
                    <td>Emma</td>
                    <td>88</td>
                    <td>90</td>
                    <td>85</td>
                    <td>263</td>
                    <td>A</td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
