<!DOCTYPE html>
<html>

<head>
    <title>Navigation Bar</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 30px;
            animation: fadeIn 1s ease-in;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 8px 12px;
            transition: background-color 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #555;
            border-radius: 5px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tablet View */
        @media screen and (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links {
                gap: 15px;
            }
        }

        /* Mobile View */
        @media screen and (max-width: 480px) {
            .navbar {
                padding: 15px;
            }

            .nav-links {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                width: 100%;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                display: block;
                width: 100%;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">MySite</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>

</html>
