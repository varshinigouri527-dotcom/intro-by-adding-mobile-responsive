<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            background:#fff;
            width:100%;
            max-width:700px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
            color:#333;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        textarea{
            resize:vertical;
        }

        .radio-group,
        .checkbox-group{
            margin-top:5px;
        }

        .radio-group label,
        .checkbox-group label{
            display:inline-block;
            margin-right:15px;
            font-weight:normal;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        @media(max-width:600px){

            .container{
                padding:20px;
            }

            h1{
                font-size:24px;
            }

            input,
            select,
            textarea{
                font-size:14px;
            }

            button{
                font-size:16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>College Registration Form</h1>

        <form>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" placeholder="Enter mobile number" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender">
                    <label for="other">Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                    <option>BBA</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hobbies</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="sports">
                    <label for="sports">Sports</label>

                    <input type="checkbox" id="music">
                    <label for="music">Music</label>

                    <input type="checkbox" id="reading">
                    <label for="reading">Reading</label>

                    <input type="checkbox" id="coding">
                    <label for="coding">Coding</label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="4" placeholder="Enter your address"></textarea>
            </div>

            <button type="submit">Register</button>

        </form>
    </div>

</body>
</html>
