<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e6f0ff 0%, #f7fbff 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222;
        }

        .profile-card {
            width: min(380px, 90vw);
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(16, 40, 83, 0.15);
            padding: 32px 28px;
            text-align: center;
        }

        .profile-card__avatar {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #4caf50;
            box-shadow: 0 16px 30px rgba(76, 175, 80, 0.18);
            margin-bottom: 22px;
        }

        .profile-card__name {
            font-size: 1.75rem;
            margin: 0;
        }

        .profile-card__title {
            margin: 8px 0 22px;
            color: #6b7280;
            font-size: 0.98rem;
            letter-spacing: 0.03em;
        }

        .profile-card__bio {
            margin: 0 auto 26px;
            max-width: 280px;
            line-height: 1.7;
            color: #5b6674;
            font-size: 0.98rem;
        }

        .profile-card__stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .profile-card__stat {
            background: #f5f8ff;
            border-radius: 18px;
            padding: 14px 12px;
        }

        .profile-card__stat strong {
            display: block;
            font-size: 1.2rem;
            color: #111827;
        }

        .profile-card__stat span {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .profile-card__actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .profile-card__button {
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .profile-card__button--primary {
            background: #4caf50;
            color: white;
            box-shadow: 0 12px 22px rgba(76, 175, 80, 0.18);
        }

        .profile-card__button--secondary {
            background: #eef2ff;
            color: #3730a3;
        }

        .profile-card__button:hover {
            transform: translateY(-1px);
        }

        .profile-card__button--primary:hover {
            background: #43a047;
        }

        .profile-card__button--secondary:hover {
            background: #e0e7ff;
        }
    </style>
</head>
<body>
    <article class="profile-card">
        <h1 class="profile-card__name">Gouri Varshini</h1>
        <p class="profile-card__title">UI/UX Designer & Front-end Developer</p>
        <p class="profile-card__bio">Crafting elegant digital experiences with clean design, delightful interactions, and responsive layouts.</p>
        <div class="profile-card__stats">
            <div class="profile-card__stat">
                <strong>32</strong>
                <span>Projects</span>
            </div>
            <div class="profile-card__stat">
                <strong>8k</strong>
                <span>Followers</span>
            </div>
            <div class="profile-card__stat">
                <strong>14</strong>
                <span>Certificates</span>
            </div>
        </div>
        <div class="profile-card__actions">
            <button class="profile-card__button profile-card__button--primary">Follow</button>
            <button class="profile-card__button profile-card__button--secondary">Message</button>
        </div>
    </article>
</body>
</html>
