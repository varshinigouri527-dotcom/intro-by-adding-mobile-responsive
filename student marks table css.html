<!DOCTYPE html>
<html>

<head>
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 40px;
            text-align: center;
        }

        h1 {
            color: darkblue;
            margin-bottom: 20px;
        }

        img {
            border-radius: 50%;
            margin-bottom: 20px;
        }

        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 2px 2px 10px lightgray;
        }

        th {
            background-color: darkblue;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border: 1px solid #ccc;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #dbe9ff;
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
         alt="Student Image"
         width="150">

    <table>
        <tr>
            <th>Student Name</th>
            <th>Maths</th>
            <th>Science</th>
            <th>English</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>varshini</td>
            <td>95</td>
            <td>90</td>
            <td>92</td>
            <td>277</td>
        </tr>

        <tr>
            <td>narasimha</td>
            <td>88</td>
            <td>85</td>
            <td>91</td>
            <td>264</td>
        </tr>

        <tr>
            <td>jaanu</td>
            <td>93</td>
            <td>89</td>
            <td>94</td>
            <td>276</td>
        </tr>
    </table>

</body>

</html>
