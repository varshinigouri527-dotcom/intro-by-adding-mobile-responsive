<!DOCTYPE html>
<html>

<head>
    <title>Favourite Things Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 40px;
            color: #333;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 2px 2px 12px lightgray;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        h2 {
            color: darkgreen;
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        ol, ul {
            font-size: 17px;
        }

        li {
            margin: 8px 0;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: crimson;
            padding: 10px 15px;
            border-radius: 5px;
        }

        a:hover {
            background-color: darkred;
        }

        mark {
            background-color: yellow;
            padding: 2px 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Favourite Things</h1>

        <p>
            <b>Welcome</b> to my favourite things page.<br>
            I like <i>music</i>, <u>travelling</u>, and <mark>coding</mark>.
        </p>

        <h2>My Favourite Movies</h2>
        <ol>
            <li>anand</li>
            <li>fidaa</li>
            <li>dear comrade</li>
        </ol>

        <h2>My Hobbies</h2>
        <ul>
            <li>Listening to music</li>
            <li>Playing games</li>
            <li>Reading books</li>
        </ul>

        <h2>Favourite Website</h2>

        <a href="https://www.youtube.com" target="_blank">
            Visit YouTube
        </a>

    </div>

</body>

</html>
